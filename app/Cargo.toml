[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
external-services = { path = "../external-services" }

axum = "0.7"
tokio = { version = "1", features = ["full"] }

sea-orm = { version = "=2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls"
] }

tower = "0.5.3"

utoipa = { version = "5", features = ["macros", "axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
dotenvy = "0.15.7"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
tower-http = { version = "0.6.11", features = ["trace"] }


